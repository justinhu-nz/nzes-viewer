<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZES 2023 Explorer</title>
<style>
:root{
  color-scheme: light;
  --page:#f6f5f1; --surface:#fcfcfb; --surface-2:#f0efea; --ink:#141413; --ink-2:#52514e; --muted:#7d7b75;
  --grid:#e4e3dc; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --accent:#1c5cab; --accent-wash:#e3edf9;
  --warn:#9a5b00; --warn-wash:#fdf3df;
  --div-n2:#1c5cab; --div-n1:#6da7ec; --div-0:#dcdad3; --div-p1:#ef8f8a; --div-p2:#c63837;
  --seq-0:#eef4fc; --seq-1:#1c5cab;
  --p-lab:#d82c20; --p-nat:#1b5fae; --p-grn:#2e8540; --p-act:#e3ad00; --p-nzf:#3c3c3a; --p-tpm:#8c2d5a;
  --p-top:#17a398; --p-grn-2:#86c08f; --p-oth:#a28a62; --p-non:#b5b3ab; --p-dk:#d6d4cc;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#6250d6; --cat-8:#e34948;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#45443f; --border:rgba(255,255,255,.10); --accent:#6da7ec; --accent-wash:#1b2a3d;
    --warn:#f0b54a; --warn-wash:#33280f;
    --div-n2:#3987e5; --div-n1:#255b9c; --div-0:#3a3a37; --div-p1:#9c3a39; --div-p2:#e66767;
    --seq-0:#1d2632; --seq-1:#6da7ec;
    --p-lab:#e5534a; --p-nat:#4a8ae0; --p-grn:#3fa457; --p-act:#e8bb22; --p-nzf:#a3a29c; --p-tpm:#c0558a;
    --p-top:#2cc0b3; --p-grn-2:#1f6b30; --p-oth:#b39c76; --p-non:#6b6a65; --p-dk:#4a4945;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#45443f; --border:rgba(255,255,255,.10); --accent:#6da7ec; --accent-wash:#1b2a3d;
    --warn:#f0b54a; --warn-wash:#33280f;
    --div-n2:#3987e5; --div-n1:#255b9c; --div-0:#3a3a37; --div-p1:#9c3a39; --div-p2:#e66767;
    --seq-0:#1d2632; --seq-1:#6da7ec;
    --p-lab:#e5534a; --p-nat:#4a8ae0; --p-grn:#3fa457; --p-act:#e8bb22; --p-nzf:#a3a29c; --p-tpm:#c0558a;
    --p-top:#2cc0b3; --p-grn-2:#1f6b30; --p-oth:#b39c76; --p-non:#6b6a65; --p-dk:#4a4945;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font)}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em;margin-right:8px;white-space:nowrap}
.brand small{font-weight:450;color:var(--muted);margin-left:6px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-selected=true]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.globals{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.globals label{display:flex;gap:6px;align-items:center}
select,input[type=search]{background:var(--surface);border:1px solid var(--axis);border-radius:7px;padding:5px 8px;max-width:100%}
#gFilterVar,#gFilterVal{max-width:210px}
.iconbtn{background:var(--surface);border:1px solid var(--axis);border-radius:7px;padding:5px 9px;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
main{max-width:1320px;margin:0 auto;padding:20px}
section.view{display:none}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.card h3{font-size:14px;margin:14px 0 6px;font-weight:600}
.sub{color:var(--ink-2);margin:0 0 12px;font-size:13px;max-width:80ch}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em}
.tile .l{color:var(--ink-2);font-size:12.5px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.layout>*{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{max-height:45vh!important;position:static!important}}
.side{position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.side .search{padding:12px;border-bottom:1px solid var(--border)}
.side .search input{width:100%}
.side .list{overflow:auto;padding:4px 0 12px}
.side details{border-bottom:1px solid var(--grid)}
.side summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:12.5px;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between}
.side summary::-webkit-details-marker{display:none}
.side summary .c{font-weight:400;color:var(--muted)}
.vitem{display:flex;gap:8px;padding:5px 12px 5px 14px;cursor:pointer;font-size:12.5px;line-height:1.3;border-left:3px solid transparent}
.vitem:hover{background:var(--surface-2)}
.vitem.sel{background:var(--accent-wash);border-left-color:var(--accent)}
.vitem code{flex:0 0 auto;min-width:46px;color:var(--muted);font-size:11.5px;padding-top:1px}
.qhead .code{display:inline-block;font:600 12px/1 ui-monospace,Menlo,monospace;background:var(--surface-2);padding:4px 6px;border-radius:5px;color:var(--ink-2);margin-right:6px}
.qhead h2{display:inline;font-size:18px}
.qhead .stem{color:var(--ink-2);margin:8px 0 0;font-size:13px}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 6px;font-size:13px}
.controls label{display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.controls label{max-width:100%;min-width:0}
#xBy{max-width:min(340px,100%)!important;min-width:0;flex:1 1 auto}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed=true]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4;cursor:default}
.chart{width:100%;overflow-x:auto}
svg{display:block;max-width:100%}
svg text{fill:var(--ink-2);font:12px var(--font)}
svg .ink{fill:var(--ink)}
svg .muted{fill:var(--muted)}
svg .grid{stroke:var(--grid)}
svg .axis{stroke:var(--axis)}
svg .hit:hover+.hl, svg g.mark:hover > .m{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.basebar{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-top:10px}
.basebar b{color:var(--ink);font-weight:600}
.warnbox{font-size:12.5px;background:var(--warn-wash);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0}
table.data{border-collapse:collapse;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left;white-space:normal}
table.data thead th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface);vertical-align:bottom;white-space:normal}
table.data td.low{color:var(--muted);font-style:italic}
table.data td.sup{color:var(--muted)}
table.data tr.total td{font-weight:600}
.tablewrap{max-height:520px;overflow:auto;margin-top:10px;border:1px solid var(--grid);border-radius:8px}
.tbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.4;padding:7px 9px;border-radius:7px;max-width:300px;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{font-weight:650}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:middle}
.methods p,.methods li{max-width:85ch}
.methods h3{margin-top:18px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){main{padding:12px}.bar{padding:8px 12px}.card{padding:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">NZES 2023 Explorer<small>New Zealand Election Study</small></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="globals">
      <label title="Survey weight applied to every estimate">Weight
        <select id="gWeight">
          <option value="vwgt">Vote-validated (vwgt)</option>
          <option value="bwgt">Demographic only (bwgt)</option>
          <option value="mwgt">Māori subsample (mwgt)</option>
          <option value="none">Unweighted</option>
        </select></label>
      <label title="Restrict every view to one subgroup">Filter
        <select id="gFilterVar"><option value="">Everyone</option></select>
        <select id="gFilterVal" hidden></select></label>
      <label title="Include 'Don't know' and other non-substantive answers"><input type="checkbox" id="gDK"> Show “Don’t know”</label>
      <button class="iconbtn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light/dark"><svg width="16" height="16" viewBox="0 0 16 16" style="display:block"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>
<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-explore">
    <div class="layout">
      <aside class="side">
        <div class="search"><input type="search" id="q" placeholder="Search questions, e.g. trust, co-governance, B6…" aria-label="Search questions"></div>
        <div class="list" id="vlist"></div>
      </aside>
      <div id="xmain"></div>
    </div>
  </section>
  <section class="view" id="v-parties"></section>
  <section class="view" id="v-flows"></section>
  <section class="view" id="v-groups"></section>
  <section class="view" id="v-issues"></section>
  <section class="view" id="v-methods"></section>
</main>
<div id="tip" role="tooltip"></div>
<script>
const NZES = /*__DATA__*/null;
</script>
<script>
"use strict";
/* ============================================================ data */
const N = NZES.meta.n;
const V = {}; NZES.vars.forEach(v => { V[v.n] = v; v.miss = new Set(v.miss); });
const COL = {};
for (const [k, arr] of Object.entries(NZES.cols)) {
  const a = new Float64Array(N); for (let i = 0; i < N; i++) a[i] = arr[i] == null ? NaN : arr[i]; COL[k] = a;
}
const WTS = {}; for (const [k, arr] of Object.entries(NZES.w)) WTS[k] = Float64Array.from(arr);
WTS.none = new Float64Array(N).fill(1);

const S = { weight: "vwgt", dk: false, fVar: "", fVal: null, tab: "overview", xVar: "mvpartyvote", xBy: "", xView: "dist" };

/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtP = (p, d = 0) => (p == null || isNaN(p)) ? "—" : (100 * p).toFixed(d) + "%";
const fmtN = n => Math.round(n).toLocaleString("en-NZ");
const fmt1 = x => (x == null || isNaN(x)) ? "—" : x.toFixed(1);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const _codes = {};
function codesOf(v) {
  if (_codes[v]) return _codes[v];
  let cs = Object.keys(V[v].lab).map(Number).sort((a, b) => a - b);
  if (cs.includes(0) && isPartyVar(v) && /not vote|^none|^no party|^no$/i.test(V[v].lab[0])) { const miss = cs.filter(c => V[v].miss.has(c)); cs = [...cs.filter(c => c !== 0 && !V[v].miss.has(c)), 0, ...miss]; }
  return (_codes[v] = cs);
}
const lab = (v, c) => V[v].lab[c] ?? String(c);
const substantive = (v, c) => !V[v].miss.has(c);
const titleOf = v => { const m = V[v]; if (m.k === "multi" && m.tr && m.lab[1] && m.lab[1].length > 12) return m.lab[1]; return m.it && (m.tr || m.it.length >= 40) ? m.it : m.t; };
const MIN_N = 30, SUP_N = 10;

function weightVec() { return WTS[S.weight]; }
function filterMask() {
  const m = new Uint8Array(N).fill(1);
  const w = weightVec();
  for (let i = 0; i < N; i++) if (!(w[i] > 0)) m[i] = 0;          // mwgt zeroes non-Māori
  if (S.fVar && S.fVal != null) { const c = COL[S.fVar]; for (let i = 0; i < N; i++) if (c[i] !== S.fVal) m[i] = 0; }
  return m;
}

/* ---------- stats ---------- */
function wilson(p, n) {
  if (!(n > 0)) return [NaN, NaN]; const z = 1.96, z2 = z * z;
  const d = 1 + z2 / n, c = (p + z2 / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
/** Weighted distribution of `v` among rows where mask[i] && extra(i). */
function dist(v, mask, opt = {}) {
  const col = COL[v], w = weightVec(), meta = V[v];
  const incl = opt.dk ?? S.dk;
  const codes = codesOf(v).filter(c => incl || substantive(v, c));
  const idx = new Map(codes.map((c, i) => [c, i]));
  const sw = new Float64Array(codes.length), n = new Float64Array(codes.length);
  let SW = 0, SW2 = 0, NN = 0;
  for (let i = 0; i < N; i++) {
    if (!mask[i]) continue; const x = col[i]; if (isNaN(x)) continue;
    const k = idx.get(x); if (k === undefined) continue;
    sw[k] += w[i]; n[k]++; SW += w[i]; SW2 += w[i] * w[i]; NN++;
  }
  const neff = SW2 > 0 ? SW * SW / SW2 : 0;
  const cats = codes.map((c, k) => {
    const p = SW > 0 ? sw[k] / SW : NaN; const [lo, hi] = wilson(p, neff);
    return { code: c, label: lab(v, c), sw: sw[k], n: n[k], p, lo, hi, miss: meta.miss.has(c) };
  });
  return { v, cats, n: NN, sw: SW, neff };
}
function meanOf(v, mask) {
  const col = COL[v], w = weightVec(); let SW = 0, SWX = 0, SW2 = 0, NN = 0;
  for (let i = 0; i < N; i++) { if (!mask[i]) continue; const x = col[i]; if (isNaN(x) || V[v].miss.has(x)) continue; SW += w[i]; SWX += w[i] * x; SW2 += w[i] * w[i]; NN++; }
  if (!SW) return { m: NaN, lo: NaN, hi: NaN, n: 0, neff: 0 };
  const m = SWX / SW; let A = 0;
  for (let i = 0; i < N; i++) { if (!mask[i]) continue; const x = col[i]; if (isNaN(x) || V[v].miss.has(x)) continue; A += w[i] * w[i] * (x - m) * (x - m); }
  const se = Math.sqrt(A) / SW * (NN > 1 ? Math.sqrt(NN / (NN - 1)) : 1);
  return { m, se, lo: m - 1.96 * se, hi: m + 1.96 * se, n: NN, neff: SW * SW / SW2 };
}
function andMask(mask, v, code) { const c = COL[v], m = new Uint8Array(N); for (let i = 0; i < N; i++) m[i] = mask[i] && c[i] === code ? 1 : 0; return m; }
/* chi-square with Kish design-effect correction (first-order Rao–Scott style) */
function lgamma(x) { const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, .1208650973866179e-2, -.5395239384953e-5]; let y = x, t = x + 5.5; t -= (x + .5) * Math.log(t); let s = 1.000000000190015; for (const k of c) s += k / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function gammaQ(a, x) { // upper regularized gamma
  if (x <= 0) return 1;
  if (x < a + 1) { let s = 1 / a, d = s, ap = a; for (let n = 0; n < 500; n++) { ap++; d *= x / ap; s += d; if (Math.abs(d) < Math.abs(s) * 1e-12) break; } return 1 - s * Math.exp(-x + a * Math.log(x) - lgamma(a)); }
  let b = x + 1 - a, c = 1e300, d = 1 / b, h = d; for (let i = 1; i < 500; i++) { const an = -i * (i - a); b += 2; d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300; c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-12) break; }
  return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
}
function chiTest(table, neffTotal) { // table[r][c] = weighted sums
  const R = table.length, C = table[0].length; let T = 0; const rs = Array(R).fill(0), cs = Array(C).fill(0);
  table.forEach((row, i) => row.forEach((x, j) => { rs[i] += x; cs[j] += x; T += x; }));
  const rr = rs.map((x, i) => [x, i]).filter(a => a[0] > 0).map(a => a[1]), cc = cs.map((x, j) => [x, j]).filter(a => a[0] > 0).map(a => a[1]);
  if (rr.length < 2 || cc.length < 2) return null;
  let X = 0; for (const i of rr) for (const j of cc) { const e = rs[i] * cs[j] / T; X += (table[i][j] - e) ** 2 / e; }
  X = X / T * neffTotal; const df = (rr.length - 1) * (cc.length - 1);
  const V = Math.sqrt(X / neffTotal / Math.min(rr.length - 1, cc.length - 1));
  return { X, df, p: gammaQ(df / 2, X / 2), V };
}

/* ---------- colours ---------- */
const PARTY_RULES = [
  [/^labou?r/i, "--p-lab"], [/^national/i, "--p-nat"], [/^green/i, "--p-grn"], [/^act$/i, "--p-act"],
  [/^nz first/i, "--p-nzf"], [/te p[aā]ti|^m[aā]ori$/i, "--p-tpm"], [/opportunit|^top$/i, "--p-top"],
  [/^another|^other/i, "--p-oth"], [/not vote|^nonvote|^none|^no party|^no$|^neither/i, "--p-non"],
  [/don.?t know|missing|unlabelled/i, "--p-dk"],
  [/^yes, labour/i, "--p-lab"], [/^yes, national/i, "--p-nat"], [/^yes, another/i, "--p-oth"],
  [/left bloc/i, "--p-lab"], [/right bloc/i, "--p-nat"],
  [/christopher luxon/i, "--p-nat"], [/chris hipkins/i, "--p-lab"], [/james shaw/i, "--p-grn"], [/marama davidson/i, "--p-grn-2"], [/david seymour/i, "--p-act"],
];
function isPartyVar(v) { const L = Object.values(V[v].lab); return L.filter(t => /^(labou?r|national|green|act|nz first)$/i.test(t) || /luxon|hipkins/i.test(t) || /bloc/.test(t)).length >= 2; }
function partyColor(label) { for (const [re, c] of PARTY_RULES) if (re.test(label)) return css(c); return null; }
const ORD_RE = /agree|trust|satisf|interest|well|likely|more|less|good|bad|often|close|definitely|positively|negatively|easy|difficult|fair|high|low|much|lot|very|always|usually|never|important|too far|too high|too low/i;

function buildList(filter = "") {

    if (!groups.has(g)) groups.set(g, []); groups.get(g).push(v);

    const open = f || vs.some(v => v.n === S.xVar);
    h += `<details ${open ? "open" : ""}><summary>${esc(g)}<span class="c">${vs.length}</span></summary>${vs.map(v => `<div class="vitem ${v.n === S.xVar ? "sel" : ""}" data-v="${v.n}"><code>${esc(v.n.length > 9 ? v.n.slice(0, 8) + "…" : v.n)}</code><span>${esc(titleOf(v.n))}</span></div>`).join("")}</details>`;

}

$("#vlist").addEventListener("click", e => { const it = e.target.closest(".vitem"); if (!it) return; S.xVar = it.dataset.v; if (S.xView === "battery" && !V[S.xVar].bat) S.xView = "dist"; document.querySelectorAll(".vitem.sel").forEach(x => x.classList.remove("sel")); it.classList.add("sel"); writeHash(); renderExplore(false); });

function groupsOf(by, mask) { return codesOf(by).filter(c => substantive(by, c)).map(c => ({ code: c, label: lab(by, c), mask: andMask(mask, by, c) })); }

function renderDist(v, W) {

function pick(c) { return c ? { p: c.p, lo: c.lo, hi: c.hi } : { p: NaN }; }

function scaleRange(v) { const meta = V[v]; if (meta.k === "scale") return [0, 10]; if (meta.k === "num") { const c = COL[v]; let lo = Infinity, hi = -Infinity; for (let i = 0; i < N; i++) if (!isNaN(c[i]) && !meta.miss.has(c[i])) { lo = Math.min(lo, c[i]); hi = Math.max(hi, c[i]); } return [lo, hi]; } const cs = codesOf(v).filter(c => substantive(v, c)); return [cs[0], cs[cs.length - 1]]; }

      s += `<g data-tip="${esc(t)}"><line x1="${x(Math.min(sv.m.m, r.all.m))}" x2="${x(Math.max(sv.m.m, r.all.m))}" y1="${y}" y2="${y}" stroke="${c}" stroke-opacity=".35" stroke-width="2"/><rect x="${x(sv.m.m) - 6}" y="${y - 6}" width="12" height="12" transform="rotate(45 ${x(sv.m.m)} ${y})" fill="var(--surface)" stroke="${c}" stroke-width="2.2"/></g>`;
    }
    const t = `<b>${r.name}</b> placed at <b>${r.all.m.toFixed(2)}</b> by all respondents (CI ${r.all.lo.toFixed(2)}–${r.all.hi.toFixed(2)}), n = ${fmtN(r.all.n)}`;
    s += `<g data-tip="${esc(t)}"><rect x="${labW}" y="${y - rowH / 2}" width="${plotW}" height="${rowH}" fill="transparent"/><line x1="${x(r.all.lo)}" x2="${x(r.all.hi)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3"/><circle cx="${x(r.all.m)}" cy="${y}" r="7" fill="${c}" stroke="var(--surface)" stroke-width="2"/></g>`;
  });
  s += "</svg>";

  // like/dislike matrices
  const which = S.likeSet || "B1";
  const items = which === "B1" ? PARTIES.map(([n, l]) => ["B1" + l, n]) : "abcdefghi".split("").map(l => ["B3" + l, V["B3" + l].t.replace(/^.*dislike\s+/i, "").replace(/\?$/, "")]);
  const groups = VOTEGRP.map(([code, name]) => ({ name, mask: andMask(mask, "mvpartyvote", code) }));
  const rowsH = [{ name: "All respondents", mask }, ...groups].map(g => {
    let n = 0; for (let i = 0; i < N; i++) if (g.mask[i]) n++;
    return { label: g.name, n, cells: items.map(([v, nm]) => { const m = meanOf(v, g.mask); return m.n < SUP_N ? { v: NaN } : { v: m.m, txt: m.m.toFixed(1), low: m.n < MIN_N, tip: `<b>${esc(g.name)}</b> rating of <b>${esc(nm)}</b><br>mean ${m.m.toFixed(2)} (CI ${m.lo.toFixed(1)}–${m.hi.toFixed(1)}), n = ${m.n}` }; }) };
  });
  // B4 preferred PM by vote
  el.innerHTML = `${filterNote()}
  <div class="card"><h2>Where voters place the parties on the left–right scale</h2>
    <p class="sub">● Mean placement of each party by all respondents (B5, line = 95% CI). ◇ Mean self-placement (B6) of that party’s own validated voters. The shaded band is the average respondent’s self-placement. Gaps between ● and ◇ show how far voters see their party from themselves.</p>
    <div class="chart">${s}</div>
    <div class="legend"><span><i style="background:var(--ink-2);border-radius:50%"></i>Party as placed by all respondents</span><span><i style="border:2px solid var(--ink-2);background:none;transform:rotate(45deg);width:9px;height:9px"></i>Self-placement of the party’s voters</span></div>
  </div>
  <div class="card"><h2>How much each party’s voters like the ${which === "B1" ? "parties" : "leaders"}</h2>
    <p class="sub">Mean rating on a 0 (strongly dislike) to 10 (strongly like) scale, by validated 2023 party vote. Italic cells rest on fewer than ${MIN_N} respondents.</p>
    <div class="controls"><span class="seg"><button data-like="B1" aria-pressed="${which === "B1"}">Parties (B1)</button><button data-like="B3" aria-pressed="${which === "B3"}">Leaders (B3)</button></span></div>
    ${heatTable(items.map(i => i[1]), rowsH, { lo: 0, hi: 10, corner: "Voted for ↓  /  rating of →", nCol: true })}
  </div>`;
  el.querySelectorAll("[data-like]").forEach(b => b.addEventListener("click", () => { S.likeSet = b.dataset.like; renderParties(); }));
}

/* ============================================================ FLOWS */
function renderFlows() {
  const el = $("#v-flows"); const mask = filterMask(); const W = cardW(el);
  const panelOnly = !!S.panelOnly; const m0 = panelOnly ? andMask(mask, "msample", 5) : mask;
  const L = [[1, "Labour"], [2, "National"], [3, "Green"], [4, "ACT"], [5, "NZ First"], [6, "Te Pāti Māori"], [7, "Another party"], [0, "Did not vote"]];
  const a = COL.mppartyvote, b = COL.mvpartyvote, w = weightVec();
  const M = L.map(() => L.map(() => 0)), Mn = L.map(() => L.map(() => 0)); const idx = new Map(L.map(([c], i) => [c, i]));
  let T = 0, n = 0;
  for (let i = 0; i < N; i++) { if (!m0[i]) continue; const r = idx.get(a[i]), c = idx.get(b[i]); if (r === undefined || c === undefined) continue; M[r][c] += w[i]; Mn[r][c]++; T += w[i]; n++; }
  const rs = M.map(r => r.reduce((x, y) => x + y, 0)), cs = L.map((_, j) => M.reduce((x, r) => x + r[j], 0));
  // sankey
  const H = 460, nodeW = 14, gap = 8, left = 120, right = Math.max(left + 300, W - 120);
  const scale = (H - 30 - gap * (L.length - 1)) / T;
  const ly = [], ry = []; let y = 10; rs.forEach((v, i) => { ly[i] = y; y += v * scale + gap; }); y = 10; cs.forEach((v, j) => { ry[j] = y; y += v * scale + gap; });
  const lo = ly.slice(), ro = ry.slice();
  let s = svgOpen(right + 120, H);
  L.forEach(([, name], i) => L.forEach(([, n2], j) => {
    const v = M[i][j]; if (v <= 0) return; const h = v * scale; const y0 = lo[i] + h / 2, y1 = ro[j] + h / 2; lo[i] += h; ro[j] += h;
    const c = partyColor(name) || css("--p-oth"); const mx = (left + nodeW + right) / 2;
    const t = `<b>${name} 2020 → ${n2} 2023</b><br>${fmtP(v / rs[i], 1)} of ${name} 2020 voters<br>${fmtP(v / T, 1)} of all · n = ${Mn[i][j]}`;
    s += `<path data-tip="${esc(t)}" d="M${left + nodeW},${y0} C${mx},${y0} ${mx},${y1} ${right},${y1}" stroke="${c}" stroke-opacity="${i === j ? .5 : .28}" stroke-width="${Math.max(1, h)}" fill="none"/>`;
  }));
  L.forEach(([, name], i) => {
    const c = partyColor(name) || css("--p-oth");
    if (rs[i] > 0) s += `<rect x="${left}" y="${ly[i]}" width="${nodeW}" height="${rs[i] * scale}" fill="${c}"/><text class="ink" x="${left - 8}" y="${ly[i] + rs[i] * scale / 2 + 4}" text-anchor="end">${name} <tspan class="muted">${fmtP(rs[i] / T)}</tspan></text>`;
    if (cs[i] > 0) s += `<rect x="${right}" y="${ry[i]}" width="${nodeW}" height="${cs[i] * scale}" fill="${c}"/><text class="ink" x="${right + nodeW + 8}" y="${ry[i] + cs[i] * scale / 2 + 4}">${name} <tspan class="muted">${fmtP(cs[i] / T)}</tspan></text>`;
  });
  s += `<text class="muted" x="${left}" y="${H - 2}" font-size="11">2020 (recalled, E16)</text><text class="muted" x="${right + nodeW}" y="${H - 2}" text-anchor="end" font-size="11">2023 (validated)</text></svg>`;
  // retention table
  const rowsH = L.map(([, name], i) => ({ label: name + " 2020", n: Mn[i].reduce((x, y) => x + y, 0), cells: L.map(([, n2], j) => { const p = rs[i] ? M[i][j] / rs[i] : NaN; return { v: p, txt: fmtP(p), low: Mn[i].reduce((x, y) => x + y, 0) < MIN_N, tip: `${name} 2020 → ${n2} 2023: ${fmtP(p, 1)}` }; }) }));
  // split ticket
  const pv = COL.mvpartyvote, ev = COL.mvelecvote; const L2 = L.slice(0, 7); const SM = L2.map(() => L2.map(() => 0)); const SN = L2.map(() => 0);
  for (let i = 0; i < N; i++) { if (!mask[i]) continue; const r = idx.get(pv[i]), c = idx.get(ev[i]); if (r === undefined || c === undefined || r > 6 || c > 6) continue; SM[r][c] += w[i]; SN[r]++; }
  const splitRows = L2.map(([, name], i) => { const t = SM[i].reduce((x, y) => x + y, 0); return { label: name, n: SN[i], cells: L2.map(([, n2], j) => ({ v: t ? SM[i][j] / t : NaN, txt: t ? fmtP(SM[i][j] / t) : "—", low: SN[i] < MIN_N, tip: `${name} party voters giving their electorate vote to ${n2}: ${fmtP(SM[i][j] / t, 1)}` })) }; });
  let tot = 0, straight = 0; SM.forEach((r, i) => r.forEach((x, j) => { tot += x; if (i === j) straight += x; }));
  el.innerHTML = `${filterNote()}
  <div class="card"><h2>From 2020 to 2023: how votes moved</h2>
    <p class="sub">Flows from recalled 2020 party vote to validated 2023 party vote (weighted, n = ${fmtN(n)}). Recalled vote tends to over-state support for the previous winner (here Labour), so treat 2020 sizes as approximate. Hover a ribbon for detail.</p>
    <div class="controls"><label><input type="checkbox" id="panelOnly" ${panelOnly ? "checked" : ""}> 2020 panel members only (recall checked against their 2020 interview is not in this release)</label></div>
    <div class="chart">${s}</div>
    <h3>Where each party’s 2020 voters went (row %)</h3>
    ${heatTable(L.map(l => l[1]), rowsH, { lo: 0, hi: 1, corner: "2020 ↓  /  2023 →", nCol: true })}
  </div>
  <div class="card"><h2>Split-ticket voting under MMP</h2>
    <p class="sub">Of each party’s validated party voters, the share giving their electorate vote to each party’s candidate. Overall, <b>${fmtP(straight / tot)}</b> voted for the same party with both votes.</p>
    ${heatTable(L2.map(l => l[1]), splitRows, { lo: 0, hi: 1, corner: "Party vote ↓  /  electorate vote →", nCol: true })}
  </div>`;
  $("#panelOnly").addEventListener("change", e => { S.panelOnly = e.target.checked; renderFlows(); });
}

/* ============================================================ WHO VOTED FOR WHOM */
const GROUPVARS = ["ageband", "mgender", "methnic", "mmaori", "meducate", "H30", "oesch5_moesch5", "H22", "mreldom", "murbrur", "mauckland", "maoriel_23w", "B6grp", "H20"];
function renderGroups() {
  const el = $("#v-groups"); const mask = filterMask(); const W = cardW(el);
  const inclNon = !!S.gNon; const target = "mvpartyvote";
  const colors = colorsFor(target, dist(target, mask, { dk: false }).cats);
  const reorder = cats => { const order = inclNon ? [2, 1, 3, 4, 5, 6, 7, 0] : [2, 1, 3, 4, 5, 6, 7]; const m = new Map(cats.map(c => [c.code, c])); const tot = order.reduce((a, c) => a + (m.get(c)?.sw || 0), 0); return order.map(c => m.get(c)).filter(Boolean).map(c => ({ ...c, p: c.sw / tot })); };
  const allD = dist(target, mask, { dk: false });
  let blocks = `<div class="card"><h2>Who voted for whom</h2><p class="sub">Validated 2023 party vote within each group${inclNon ? ", including non-voters" : " (voters only)"}. Numbers in bars are percentages; the right-hand figure is the group’s unweighted n (* = under ${MIN_N}).</p>
  <div class="controls"><label><input type="checkbox" id="gNon" ${inclNon ? "checked" : ""}> Include non-voters</label></div>
  ${legendHTML(reorder(allD.cats), colors)}
  ${stacked([{ label: "All", n: allD.n, bold: true, segs: reorder(allD.cats) }], colors, { width: W, labW: 240 })}`;
  const csv = [["Variable", "Group", ...reorder(allD.cats).map(c => c.label), "n"]];
  GROUPVARS.filter(g => V[g]).forEach(g => {
    const gs = groupsOf(g, mask).map(x => { const d = dist(target, x.mask, { dk: false }); const segs = reorder(d.cats); const n = segs.reduce((a, c) => a + c.n, 0); csv.push([V[g].t, x.label, ...segs.map(c => (c.p * 100).toFixed(1)), n]); return { label: x.label, n, segs }; });
    blocks += `<h3>${esc(V[g].t)}</h3>` + stacked(gs, colors, { width: W, labW: 240, rowH: 28 });
  });
  el.innerHTML = filterNote() + blocks + `<div class="tbtns"><button class="iconbtn" id="gcsv">Download all as CSV</button></div></div>`;
  $("#gNon").addEventListener("change", e => { S.gNon = e.target.checked; renderGroups(); });
  $("#gcsv").addEventListener("click", () => csvDownload("party_vote_by_group.csv", csv));
}

/* ============================================================ ISSUES */
const ISSUE_FLAGS = ["minflation", "meconomy", "mtax", "mhousing", "mhealth", "meducation", "mcrime", "mclimate", "menvironment", "mequality", "mwelfare", "mwages", "mdebt", "mchange", "mtiriti", "mimmigration", "mtrust", "mstable", "mtransport", "mfarming", "mpension", "mcovid", "mfreedom", "mrights", "mwomen", "mabortion", "mforeign", "mpeople"];
function renderIssues() {
  const el = $("#v-issues"); const mask = filterMask(); const W = cardW(el); const W2 = cardW(el, true);
  const d = dist("mllcat", mask, { dk: true }); const cats = d.cats.filter(c => c.n > 0).sort((a, b) => b.p - a.p);
  const bars = hBars(cats.map(c => ({ label: c.label, p: c.p, lo: c.lo, hi: c.hi, n: c.n, color: css("--accent") })), { width: W2, labW: 150 });
  // by party: share of party's voters naming each category
  const P = [[2, "National"], [1, "Labour"], [3, "Green"], [4, "ACT"], [5, "NZ First"], [6, "Te Pāti Māori"], [0, "Did not vote"]];
  const pd = P.map(([c, n]) => ({ n, d: dist("mllcat", andMask(mask, "mvpartyvote", c), { dk: true }) }));
  const heat = cats.map(c => ({ label: c.label, n: c.n, cells: pd.map(x => { const k = x.d.cats.find(z => z.code === c.code); return { v: k.p, txt: fmtP(k.p), low: x.d.n < MIN_N, tip: `${esc(x.n)} voters naming <b>${esc(c.label)}</b>: ${fmtP(k.p, 1)} (CI ${fmtP(k.lo)}–${fmtP(k.hi)})` }; }) }));
  const hmax = Math.max(...heat.flatMap(r => r.cells.map(c => c.v)));
  // issue ownership: C3 by mllcat
  const C3c = colorsFor("C3", dist("C3", mask).cats);
  const own = cats.filter(c => c.n >= MIN_N).map(c => { const dd = dist("C3", andMask(mask, "mllcat", c.code)); return { label: c.label, n: dd.n, segs: dd.cats }; });
  // text-search flags
  const flags = ISSUE_FLAGS.filter(f => V[f]).map(f => { const dd = dist(f, mask, { dk: false }); const k = dd.cats.find(z => z.code === 1); return { label: V[f].t.replace(/^Issues Text Search for /i, ""), p: k.p, lo: k.lo, hi: k.hi, n: dd.n, color: css("--cat-2") }; }).sort((a, b) => b.p - a.p);
  el.innerHTML = `${filterNote()}
  <div class="grid2">
  <div class="card"><h2>Most important issue (LLM-coded)</h2><p class="sub">Answers to the open question C2 (“the single most important issue for you in the 2023 election”), classified by a large language model into 16 categories (mllcat).</p><div class="chart">${bars}</div>${baseText(d)}</div>
  <div class="card"><h2>Most important issue (keyword search)</h2><p class="sub">The same answers coded by keyword search. Answers can match several topics, so shares add to more than 100%. Comparing the two codings shows how sensitive salience is to the method.</p><div class="chart">${hBars(flags, { width: W2, labW: 170 })}</div></div>
  </div>
  <div class="card"><h2>Issue agendas of each party’s voters</h2><p class="sub">Share of each party’s validated voters whose most important issue falls in each LLM category (column %).</p>
  ${heatTable(pd.map(x => x.n), heat, { lo: 0, hi: hmax, corner: "Issue ↓  /  voters of →" })}</div>
  <div class="card"><h2>Issue ownership</h2><p class="sub">Among people naming each issue, which party they think would be best at dealing with it (C3). Issues named by fewer than ${MIN_N} respondents are omitted.</p>
  ${legendHTML(dist("C3", mask).cats, C3c)}${stacked(own, C3c, { width: W, labW: 170 })}</div>`;
}

/* ============================================================ METHODS */
function renderMethods() {
  $("#v-methods").innerHTML = `<div class="card methods"><h2>Methods & caveats</h2>
  <h3>Source</h3><p>${esc(NZES.meta.source)}. New Zealand Election Study, 2023. Sample drawn from the electoral roll; self-completion by post with an online option. The release includes an oversample of people of Māori descent, younger people, and ${fmtN(902)} respondents re-interviewed from the 2020 study. Questions D2 and D3 were not released.</p>
  <h3>Weights</h3><ul>
  <li><b>vwgt</b> (default) adjusts for gender, age, Māori/non-Māori descent, education, Auckland/not Auckland, and validated vote or non-vote. Use it for almost everything.</li>
  <li><b>bwgt</b> adjusts for gender, age and Māori descent only — useful to see how much the vote calibration moves an estimate.</li>
  <li><b>mwgt</b> scales the Māori-descent subsample to its actual size and gives everyone else zero weight; use it for analysis of Māori respondents on their own.</li></ul>
  <h3>Uncertainty</h3><p>Weighting reduces the information in the sample. Every estimate uses Kish’s effective sample size, n<sub>eff</sub> = (Σw)²/Σw², computed for that estimate’s base. Proportions get Wilson 95% intervals using n<sub>eff</sub>; means use a linearised standard error. Tests of association are Pearson χ² scaled by n<sub>eff</sub> (a first-order design correction), with Cramér’s V as effect size. The release has no strata or cluster identifiers, so these are approximate but far better than treating the data as a simple random sample.</p>
  <h3>Small groups</h3><p>Groups with fewer than ${MIN_N} respondents are marked with * and drawn faded; under ${SUP_N} they are suppressed. Pasifika respondents (n ≈ 31) and individual electorates are too small for reliable estimates and electorates are not included here.</p>
  <h3>Missing and non-substantive answers</h3><p>Codes labelled “Don’t know”, “Missing”, “Unclassified”, “Unknown” and similar, plus any code without a label in the release (e.g. 0 on A5), are treated as non-substantive and excluded unless you tick <i>Show “Don’t know”</i>. On 0–10 scales, 0 is a real answer and 99 is “Don’t know”. For tick-box questions, “not selected” is a valid answer.</p>
  <h3>Recalled vote</h3><p>2020 party vote is self-reported in 2023 (E16 / mppartyvote). Recall is known to drift towards the previous winner and towards current preferences, so vote-switching estimates are indicative.</p>
  <h3>Text answers and privacy</h3><p>Free-text answers, occupation text, city, electorate and identifiers were deliberately left out of this file. The underlying data are licensed through the data archive; do not redistribute this HTML file (it contains respondent-level data) beyond the terms of that licence.</p>
  <h3>Rebuilding</h3><p>This page is generated by <code>build.py</code> from the release <code>.dta</code> file and the questionnaire PDF.</p></div>`;
}
